# main'e gelen her değişiklik: testler → derleme → Firebase'e yayın (Hosting, kurallar, indeksler, işlevler).
# Pull request'lerde yalnız testler çalışır. Kurulum adımları: docs/canliya-alma.md
name: Test ve canlı yayın

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Emülatör testleri (işlevler ve güvenlik kuralları)
        run: npm run test:emu

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Yayın ayarı hazır mı
        id: cfg
        run: |
          if [ -f web/.env.production ] && [ "$HAS_KEY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Yayın atlandı: web/.env.production ya da FIREBASE_SERVICE_ACCOUNT gizli anahtarı yok (docs/canliya-alma.md)."
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci
      - name: Web derlemesi
        if: steps.cfg.outputs.ready == 'true'
        run: npx vite build
      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Firebase'e yayın
        if: steps.cfg.outputs.ready == 'true'
        run: npx firebase deploy --project prod --non-interactive --only hosting,firestore,storage,functions
